# Default cluster profiles. Override/extend in ~/.config/reannx/clusters.toml
# (same layout; tables are merged key by key).

[clusters.mahuika]
scheduler   = "slurm"
ssh_host    = "mahuika"                      # alias in ~/.ssh/config
workdir     = "/nesi/nobackup/{account}/{user}/reannx"
launcher    = "srun"                         # used when job.mpi = true
modules     = []                             # `module load` before apptainer
# account   = "<project>"                    # set in your user clusters.toml
[clusters.mahuika.defaults]
partition   = "genoa"
extra_directives = ["--hint=nomultithread"]
[clusters.mahuika.limits]                    # read from the live cluster 2026-11-24
cores_per_node = 168                         # genoa; VERIFY for milan (128)
mem_per_node_gb = 700                        # VERIFY
max_walltime = "21-00:00:00"

# cascade (NIWA, Hobsonville login): PBS Pro 2025.2. Probed 2026-11-24 via cascade_hob:
# queues shortq (default, <=48h), longq (48h-336h), workq (<=24h), high_mem_*, h200q/b200q (GPU);
# nodes 384 cores / ~740 GB; apptainer is on PATH (no `module` in non-login shells);
# the login node can reach docker registries. Smoke test (alpine, 1 core, `-P reannz40001`,
# shortq) accepted and completed 2026-11-24. MPI launcher still unverified.
[clusters.cascade]
scheduler   = "pbs"
ssh_host    = "cascade_hob"
workdir     = "/reannz/project/{account}/{user}/reannx"
launcher    = "mpiexec"                      # UNVERIFIED: depends on the MPI inside the image
modules     = []
# account   = "<project>"                    # e.g. your /reannz/project/<project> group
[clusters.cascade.defaults]
queue       = "shortq"
account_flag = "-P"                          # verified: qsub accepted -P reannz40001
[clusters.cascade.limits]
cores_per_node  = 384
mem_per_node_gb = 739
[clusters.cascade.queues.shortq]
max_walltime = "48:00:00"
[clusters.cascade.queues.workq]
max_walltime = "24:00:00"
[clusters.cascade.queues.longq]
max_walltime = "336:00:00"
