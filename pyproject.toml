[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reannx"
version = "0.1.0"
description = "Submit containerised programs from your laptop to SLURM/PBS clusters"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
reannx = "reannx.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
reannx = ["data/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
